<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space-X Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#050510;color:#fff;min-height:100vh}
header{text-align:center;padding:30px 20px;background:linear-gradient(135deg,#1a0b3e,#0a0a1a)}
header h1{color:#a78bfa;font-size:2.2em;margin:0}
header p{color:#ccc}
.hero{max-width:900px;margin:30px auto;padding:20px;text-align:center}
.chat-wrap{max-width:700px;margin:20px auto;background:#10102a;border:1px solid #2a2a5a;border-radius:16px;overflow:hidden}
.chat-head{background:#1e1b4b;padding:12px;text-align:center;font-weight:bold;color:#a78bfa}
#chat{height:380px;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.5}
.bot{background:#1e293b;align-self:flex-start}
.user{background:#7c3aed;align-self:flex-end}
#inputArea{display:flex;gap:8px;padding:12px;background:#0f0f23;border-top:1px solid #2a2a5a}
#q{flex:1;padding:12px;border-radius:10px;border:none;background:#1e1e3a;color:#fff;outline:none}
#send{padding:12px 18px;border:none;border-radius:10px;background:#7c3aed;color:#fff;cursor:pointer;font-weight:bold}
#send:hover{background:#6d28d9}
small{color:#888;text-align:center;display:block;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>🚀 Space-X Academy</h1>
<p> أكاديميتك الذكية للتعلم </p>
</header>

<div class="hero">
<p>اسأل المساعد الذكي عن الكورسات</p>
<div class="chat-wrap">
<div class="chat-head">💬 مساعد Space-X</div>
<div id="chat"><div class="msg bot">أهلاً 👋 أنا مساعد Space-X Academy، اسألني وهجاوبك فوراً</div></div>
<div id="inputArea">
<input id="q" placeholder="اكتب سؤالك هنا...">
<button id="send" onclick="ask()">إرسال</button>
</div>
</div>
<small>Powered by Gemini 2.0 Flash</small>
</div>

<script>
const API_KEY = "AQ.Ab8RN6Kc6EfuCYrhojY0H0-9qVGZbzDI95tZ2HGUMg10tho5LQ";
const chat = document.getElementById('chat');
const input = document.getElementById('q');

async function ask(){
  const text = input.value.trim();
  if(!text) return;
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = '';
  const tempId = Date.now();
  chat.innerHTML += `<div class="msg bot" id="${tempId}">⏳ ثواني بفكر...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
    const res = await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        contents:[{parts:[{text: text}]}]
      })
    });
    const data = await res.json();
    const el = document.getElementById(tempId);
