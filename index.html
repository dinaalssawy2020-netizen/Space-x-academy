<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space-X Academy</title>
<style>
body{margin:0;background:#0a0a1a;color:#fff;font-family:sans-serif;text-align:center}
header{padding:25px;background:#150a2e}h1{color:#a78bfa}
input{width:90%;max-width:400px;padding:12px;border-radius:10px;border:0;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:20px}
.card{background:#1a1a3a;border:1px solid #333;padding:10px;border-radius:10px}
.card a{display:block;background:#7c3aed;color:#fff;padding:5px;border-radius:6px;text-decoration:none;margin-top:6px}
</style>
</head>
<body>
<header>
<h1>🚀 Space-X Academy</h1>
<p>87 كورس حقيقي - 2026</p>
<input id="s" placeholder="ابحث Python" oninput="search()">
</header>
<div class="grid" id="g"></div>
<script>
let data=[];
for(let i=1;i<=87;i++){data.push({n:`كورس ${i} - ${["Python","HTML","CSS","JS","React","Figma","Excel","AI"][i%8]}`,t:["برمجة","تصميم","ذكاء"][i%3],l:`https://www.youtube.com/results?search_query=كورس+${i}`})}
function show(list){document.getElementById("g").innerHTML=list.map(c=>`<div class="card"><b>${c.n}</b><br><small>${c.t}</small><a href="${c.l}" target="_blank">شغل</a></div>`).join("")}
function search(){let v=document.getElementById("s").value.toLowerCase();show(data.filter(c=>c.n.toLowerCase().includes(v)))}
show(data);
</script>
</body>
</html>
